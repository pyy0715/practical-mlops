[project]
name = "practical-mlops"
version = "0.1.0"
description = "Machine Learning Platform Engineering study environment"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "prometheus-client>=0.21,<1",
  "pyjokes>=0.8,<1",
]

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.ruff]
target-version = "py312"

[tool.uv]
package = false
