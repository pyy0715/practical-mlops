[project]
name = "income-lab"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "feast[redis]>=0.67,<0.68",
  "kfp>=2.18,<2.19",
  "kfp-kubernetes>=2.18,<2.19",
  "mlflow>=3.17,<3.18",
  "pandas>=2.2,<3",
  "pyarrow>=18,<27",
  "scikit-learn>=1.7,<2",
  "s3fs>=2026.9,<2027",
  "boto3>=1.43,<1.44",
  "psycopg[binary]>=3.3,<4",
]

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[build-system]
requires = ["uv_build==0.10.11"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
