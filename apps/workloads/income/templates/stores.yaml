{{- range $name := list "postgres" "redis" }}
---
apiVersion: v1
kind: Service
metadata:
  name: income-{{ $name }}
spec:
  selector: {app: income-{{ $name }}}
  ports:
    - name: tcp
      port: {{ if eq $name "postgres" }}5432{{ else }}6379{{ end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: income-{{ $name }}
spec:
  serviceName: income-{{ $name }}
  replicas: 1
  selector:
    matchLabels: {app: income-{{ $name }}}
  template:
    metadata:
      labels: {app: income-{{ $name }}}
    spec:
      containers:
        - name: {{ $name }}
          image: {{ (index $.Values $name).image }}
          {{- if eq $name "postgres" }}
          env:
            - {name: POSTGRES_USER, value: mlflow}
            - {name: POSTGRES_DB, value: mlflow}
            - {name: PGDATA, value: /data/postgres}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ $.Values.existingSecret }}, key: POSTGRES_PASSWORD}
          readinessProbe:
            exec: {command: [pg_isready, -U, mlflow, -d, mlflow]}
          {{- else }}
          command: [sh, -ec]
          args: ['exec docker-entrypoint.sh redis-server --requirepass "$REDIS_PASSWORD" --appendonly yes --dir /data']
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ $.Values.existingSecret }}, key: REDIS_PASSWORD}
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef: {name: {{ $.Values.existingSecret }}, key: REDIS_PASSWORD}
          readinessProbe:
            exec: {command: [redis-cli, ping]}
          {{- end }}
          volumeMounts:
            - {name: data, mountPath: /data}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ $.Values.storageClassName }}
        resources:
          requests:
            storage: {{ (index $.Values $name).storage }}
{{- end }}
