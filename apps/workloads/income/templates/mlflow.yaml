apiVersion: apps/v1
kind: Deployment
metadata:
  name: income-mlflow
spec:
  replicas: 1
  selector:
    matchLabels: {app: income-mlflow}
  template:
    metadata:
      labels: {app: income-mlflow}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mlflow
          image: {{ printf "%s@%s" (required "Set image.repository" .Values.image.repository) (required "Set image.digest" .Values.image.digest) | quote }}
          command: [mlflow, server]
          args:
            - --host=0.0.0.0
            - --port=5000
            - --backend-store-uri=$(MLFLOW_BACKEND_STORE_URI)
            - --artifacts-destination=s3://mlflow-artifacts
            - --allowed-hosts=mlflow-service:*,mlflow-service.kubeflow.svc.cluster.local:*,localhost:*,127.0.0.1:*
          env:
            - name: MLFLOW_BACKEND_STORE_URI
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: MLFLOW_BACKEND_STORE_URI}
            - {name: MLFLOW_S3_ENDPOINT_URL, value: "http://seaweedfs.kubeflow.svc.cluster.local:8333"}
            - {name: AWS_DEFAULT_REGION, value: us-east-1}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: mlpipeline-minio-artifact, key: accesskey}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: mlpipeline-minio-artifact, key: secretkey}
          ports: [{name: http, containerPort: 5000}]
          readinessProbe:
            tcpSocket: {port: http}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
spec:
  selector: {app: income-mlflow}
  ports: [{name: http, port: 5000, targetPort: http}]
