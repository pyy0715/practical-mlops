apiVersion: batch/v1
kind: Job
metadata:
  generateName: income-prepare-
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: lab
          image: income-lab:dev
          command: [python, -m, income_lab.prepare]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: income-lab, key: REDIS_PASSWORD}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: mlpipeline-minio-artifact, key: accesskey}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: mlpipeline-minio-artifact, key: secretkey}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 2Gi}
